spring.application.name=demo

# Disable default Whitelabel error page (clearer JSON/HTML errors).
server.error.whitelabel.enabled=false
# Load mail credentials early (see application-local.properties)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/green_earth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# --- SMTP (works for demo and production) ---
# Each time admin clicks create account & send email, one message goes to that partner address.
# Free Gmail is typically ~500 emails/day (enough for demo).
#
# Option A — no password in repo: set env vars then run the backend (Spring maps them):
#   Windows PowerShell:  $env:SPRING_MAIL_USERNAME="your@gmail.com"; $env:SPRING_MAIL_PASSWORD="app-password-16-char"
#   (Gmail: enable 2FA → Google Account → App passwords → create an app password for Mail.)
#
# Option B — copy application-local.properties.example → application-local.properties and fill Gmail + app password
#     (application-local.properties is gitignored.)
# Option C — put username/password only in application-local.properties (not in this file).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

app.partner.portal-login-url=http://localhost:5173/partner-login
app.partner.apply-url=http://localhost:5173/partners#partner-form
app.partner.admin-review-url=http://localhost:3000/partners-management
app.partner.admin-notify-emails=

# DEV only: allow partner password reset API (returns plain password)
app.dev.partner-reset-enabled=true
